server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API, reached by its compose service name. Same origin for the browser: no CORS.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CVs are up to 5 MB (storage.MAX_UPLOAD_BYTES); nginx refuses bodies over 1 MB by default.
        client_max_body_size 6m;
        proxy_read_timeout 60s;
    }

    # Single page app: unknown paths fall back to the page itself.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
